name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag '$TAG' does not match semver vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$TAG" >> $GITHUB_ENV

  build-binaries:
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: bash ./scripts/build.sh
            asset: cliol-linux-amd64
          - os: windows-latest
            script: pwsh ./scripts/build.ps1
            asset: cliol-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build binary
        run: ${{ matrix.script }} --version "${{ github.ref_name }}"
      - name: Smoke test
        run: |
          ${{ matrix.os == 'ubuntu-latest' && format('dist/{0} --version', matrix.asset) || '' }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./dist/${{ matrix.asset }} --version
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.asset }}

  build-python:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  publish:
    needs: [build-binaries, build-python]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "*", path: release-artifacts, merge-multiple: true }
      - name: Generate checksums
        run: cd release-artifacts && sha256sum * > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
