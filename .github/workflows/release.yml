name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "ERROR: Tag '$TAG' does not match semver vX.Y.Z[-beta.N|-rc.N]"
            exit 1
          fi
          echo "VERSION=$TAG" >> $GITHUB_ENV

  build-binaries:
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            asset: cliol-linux-amd64
            script: bash ./scripts/build.sh --asset-name cliol-linux-amd64
          # Windows x86_64
          - os: windows-latest
            asset: cliol-windows-amd64.exe
            script: pwsh ./scripts/build.ps1
          # Apple Silicon (ARM64) — macos-15 is current GA (macos-14 deprecated Nov 2025)
          - os: macos-15
            asset: cliol-macos-arm64
            script: bash ./scripts/build.sh --asset-name cliol-macos-arm64
          # Intel (amd64) — macos-13 retired Dec 2025, use macos-15-intel (last Intel, until Aug 2027)
          - os: macos-15-intel
            asset: cliol-macos-amd64
            script: bash ./scripts/build.sh --asset-name cliol-macos-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build binary
        run: ${{ matrix.script }} --version "${{ github.ref_name }}"
      - name: Smoke test
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./dist/${{ matrix.asset }} --version
          else
            dist/${{ matrix.asset }} --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.asset }}

  build-python:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  publish:
    needs: [build-binaries, build-python]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "*", path: release-artifacts, merge-multiple: true }
      - name: Generate checksums
        run: cd release-artifacts && sha256sum * > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
