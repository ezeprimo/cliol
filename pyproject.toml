[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliol"
version = "0.1.1"
description = "CLI para la API de Invertir Online (IOL) construida sobre py_iol"
authors = [
    {name = "Ezequiel Primon", email = "ezeprimo@gmail.com"},
]
readme = "README.md"
license = {file = "LICENCE"}
requires-python = ">=3.8"
dependencies = [
    "pyiol-client>=0.1.3",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "bcrypt>=4.0.0",
    "platformdirs>=4.0.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
keywords = [
    "iol",
    "invertir online",
    "trading",
    "argentina",
    "cli",
    "stocks",
    "investment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
cliol = "cliol.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "build>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/ezeprimo/cliol"
Repository = "https://github.com/ezeprimo/cliol"
Issues = "https://github.com/ezeprimo/cliol/issues"

[tool.hatch.build.targets.wheel]
packages = ["cliol"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
]

[tool.ruff.lint.isort]
known-first-party = ["cliol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"